name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: opc
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/opc/no-last-train

            git fetch origin
            git reset --hard origin/main

            npm install

            cd client
            npm install
            npm run build

            cd ../server
            npm install
            npm run build

            pm2 restart nlt-server
